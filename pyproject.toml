[project]
name = "multi-repo-sdd"
version = "0.1.0"
description = "Multi-repository Spec-Driven Development knowledge and governance framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "typer>=0.19.0",
]

[project.optional-dependencies]
speckit = [
    "specify-cli==1.2.5",
]

[project.scripts]
sdd = "multi_repo_sdd.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
