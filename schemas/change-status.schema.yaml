$schema: https://json-schema.org/draft/2020-12/schema
title: ChangeStatus
type: object
required: [id, stage, repositories, approvals]
properties:
  id: { type: string }
  description: { type: string }
  stage:
    type: string
    enum: [proposals, approved, in-progress, archive]
  created_at: { type: string }
  repositories:
    type: array
    items: { type: string }
  approvals:
    type: object
    properties:
      specification: { type: boolean }
      design: { type: boolean }
      implementation: { type: boolean }
  approval_history:
    type: array
    items:
      type: object
      required: [artifact, reviewer, at]
  verification:
    type: object
    properties:
      passed: { type: boolean }
      gaps:
        type: array
        items: { type: string }
  recorded_files:
    type: object
    additionalProperties:
      type: array
      items: { type: string }
